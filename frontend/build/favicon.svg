<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a"/>
      <stop offset="100%" style="stop-color:#065f46"/>
    </linearGradient>
    <!-- Inner glow -->
    <radialGradient id="glow" cx="40%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#065f46;stop-opacity:0"/>
    </radialGradient>
    <!-- Ball shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <!-- Soft inner shadow for depth -->
    <filter id="innerShadow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <!-- Glow overlay -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#glow)"/>

  <!-- Subtle field lines (decorative background) -->
  <g opacity="0.12" stroke="#fff" stroke-width="2" fill="none">
    <!-- Center circle -->
    <circle cx="256" cy="280" r="200" stroke-dasharray="12 8"/>
    <!-- Arc lines -->
    <line x1="56" y1="280" x2="456" y2="280"/>
  </g>

  <!-- Football / Soccer ball — centered-upper area -->
  <g transform="translate(156, 80)" filter="url(#shadow)">
    <!-- Ball base -->
    <circle cx="100" cy="100" r="100" fill="#ffffff"/>
    <!-- Ball sheen -->
    <ellipse cx="72" cy="62" rx="28" ry="18" fill="#f0fdf4" opacity="0.6"/>

    <!-- Classic soccer ball pentagon/hexagon pattern in dark green -->
    <!-- Center pentagon -->
    <polygon points="100,58 122,74 114,100 86,100 78,74"
             fill="#14532d" opacity="0.9"/>
    <!-- Top-left hex -->
    <polygon points="68,40 90,56 82,80 54,80 46,54"
             fill="#14532d" opacity="0.9"/>
    <!-- Top-right hex -->
    <polygon points="132,40 154,54 146,80 118,80 110,56"
             fill="#14532d" opacity="0.9"/>
    <!-- Left hex -->
    <polygon points="34,86 56,100 52,126 26,132 14,110"
             fill="#14532d" opacity="0.9"/>
    <!-- Right hex -->
    <polygon points="166,86 188,110 176,132 150,126 146,100"
             fill="#14532d" opacity="0.9"/>
    <!-- Bottom-left hex -->
    <polygon points="52,128 76,138 76,164 50,170 34,152"
             fill="#14532d" opacity="0.9"/>
    <!-- Bottom-right hex -->
    <polygon points="124,138 148,128 166,146 154,164 128,166"
             fill="#14532d" opacity="0.9"/>
    <!-- Bottom center hex -->
    <polygon points="80,164 120,164 128,188 100,198 72,188"
             fill="#14532d" opacity="0.9"/>

    <!-- Ball outline -->
    <circle cx="100" cy="100" r="100" fill="none" stroke="#d1fae5" stroke-width="3" opacity="0.5"/>
  </g>

  <!-- Text: "FA" monogram below ball -->
  <text x="256" y="368"
        font-family="'Arial', sans-serif"
        font-size="92"
        font-weight="800"
        fill="#ffffff"
        text-anchor="middle"
        letter-spacing="6"
        opacity="0.97">FA</text>

  <!-- Thin underline accent -->
  <rect x="160" y="384" width="192" height="5" rx="2.5" fill="#4ade80" opacity="0.8"/>

  <!-- Subtext -->
  <text x="256" y="432"
        font-family="'Arial', sans-serif"
        font-size="28"
        font-weight="500"
        fill="#bbf7d0"
        text-anchor="middle"
        letter-spacing="8">ACADEMY</text>
</svg>
